---
# General

# Enable the client installation. Set to false to uninstall the PMM client.
# Type: Bool
pmm_client_install: true

# Enable the client; if set to `false` there will be just the installation.
# Type: Bool
pmm_client_enabled: true

# Define the PMM Client version
# Type: Str
pmm_client_version: 3.8.1
# Type: Int
pmm_client_version_revision: 1

# Version of the PMM Server the client connects to. When defined, the role fails
# if pmm_client_version is newer (the client must not be newer than the server).
# Type: Str
# pmm_client_server_version: 3.8.1

# Hold the pmm-client package (Debian based distributions), so that `apt upgrade`
# does not move it away from pmm_client_version. Set to false to unhold.
# Type: Bool
pmm_client_hold: true

# Allow installing pmm_client_version when a newer version is installed (Debian based
# distributions), e.g. to bring the client back to the PMM Server version.
# Type: Bool
pmm_client_allow_downgrade: true

# Hide credentials (PMM Server and service passwords) in the task output.
# Set to false to debug failing pmm-admin commands.
# Type: Bool
pmm_client_no_log: true

# Repository

# Use the official Percona repository:
# Type: Bool
pmm_client_use_official_repo: true

# APT repository (Debian based distributions): <url>/<name>/apt, signed by the Percona key
# stored in the keyring file. The major version of pmm_client_version selects pmm<major>-client.
# Type: Str
pmm_client_repository_url: http://repo.percona.com
pmm_client_repository_name: "pmm{{ (pmm_client_version | string).split('.')[0] }}-client"
pmm_client_repository_keyring: /usr/share/keyrings/percona-keyring.gpg
pmm_client_repository_key_id: 9334A25F8507EFA5
# Type: Bool
pmm_client_repository_keyring_manage: true

# Define the repository version package
# Type: Str
pmm_client_percona_release: latest

# Server

# IP address and port of the PMM Server
# Type: Str
pmm_client_server_host: localhost
# Type: Int
pmm_client_server_port: 443

# Type: Str
pmm_client_server_auth_username: admin
pmm_client_server_auth_password: admin

# set ca_certificate to false. Set it to true if you have have a certificate signed
# by an CA.
# Type: Bool
pmm_client_insecure_tls: false

# Force to set client name on initial setup
# Type: Bool
pmm_client_force_setup: false

pmm_base_client_config: "--server-url=https://{{ pmm_client_server_auth_username | quote }}:{{ pmm_client_server_auth_password | quote }}@{{ pmm_client_server_host | quote }}:{{ pmm_client_server_port | quote }} {{ '--server-insecure-tls' if pmm_client_insecure_tls else '' }} {{ '--force' if pmm_client_force_setup else '' }}"

