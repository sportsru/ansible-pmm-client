---
# Name and full version of the package:
# Type: Str
pmm_client_pkg_name: pmm-client
pmm_client_pkg_version: "{{ pmm_client_version }}-{{ pmm_client_version_revision }}.{{ ansible_distribution_release | lower }}"

# List of packages:
# Type: List
pmm_client_pkgs:
  - "{{ pmm_client_pkg_name }}={{ pmm_client_pkg_version }}"

# URLs to configure Percona repositories:
# Type: Str
pmm_client_repo: "https://repo.percona.com/apt/percona-release_{{ pmm_client_percona_release }}.{{ ansible_distribution_release | lower }}_all.deb"

# URLs for direct download of the Percona PMM Client.
# To use a direct download please set pmm_client_use_official_repo to false.
# Type: Str
pmm_client_pkg: "https://downloads.percona.com/downloads/pmm{{ (pmm_client_version | string).split('.')[0] }}/{{ pmm_client_version }}/binary/debian/{{ ansible_distribution_release }}/x86_64/pmm-client_{{ pmm_client_pkg_version }}_amd64.deb"
