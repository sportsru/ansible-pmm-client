---
# List of packages:
# Type: List
pmm_client_pkgs:
  - pmm-client-{{ pmm_client_version }}-{{ pmm_client_version_revision }}

# URLs to configure Percona repositories:
# Type: Str
pmm_client_repo: "https://repo.percona.com/yum/percona-release-{{ pmm_client_percona_release }}.noarch.rpm"

# URLs for direct download of the Percona PMM Client.
# To use a direct download please set pmm_client_use_official_repo to false.
# Type: Str
pmm_client_pkg: "https://downloads.percona.com/downloads/pmm3/{{ pmm_client_version }}/binary/redhat/{{ ansible_lsb.major_release }}/x86_64/pmm-client-{{ pmm_client_version }}-{{ pmm_client_version_revision }}.el{{ ansible_lsb.major_release }}.x86_64.rpm"
