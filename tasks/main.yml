---

- name: Gather OS specific variables
  include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_os_family }}-{{ ansible_distribution }}-{{ ansible_distribution_version }}.yml"
        - "{{ ansible_os_family }}-{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_os_family }}-{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - vars

- name: Check PMM Client version against PMM Server version
  fail:
    msg: "pmm_client_version {{ pmm_client_version }} is newer than the PMM Server ({{ pmm_client_server_version }}), the client must not be newer than the server"
  when: >
        pmm_client_install and
        pmm_client_server_version is defined and
        pmm_client_version | string is version(pmm_client_server_version | string, '>')

- include_tasks: percona-official-repo.yml
  when: >
        pmm_client_install and
        pmm_client_use_official_repo

- include_tasks: install.yml
  when: pmm_client_install

- include_tasks: server-config.yml
  when: >
        pmm_client_install and
        pmm_client_enabled

- include_tasks: add-client-services.yml
  loop: "{{ pmm_client_add_services | dict2items }}"
  when: >
        pmm_client_install and
        pmm_client_enabled

- include_tasks: remove-client-services.yml
  loop: "{{ pmm_client_remove_services | dict2items }}"
  when: >
        pmm_client_install and
        pmm_client_enabled

- include_tasks: uninstall.yml
  when: not pmm_client_install
