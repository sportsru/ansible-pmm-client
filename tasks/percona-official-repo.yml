---
- name: Ensure Percona APT repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/percona-keyring.gpg] http://repo.percona.com/pmm3-client/apt {{ ansible_distribution_release }} main'
    filename: percona-pmm3-client-release
  delay: 10
  register: result
  retries: 3
  until: result is succeeded
  when: ansible_os_family == "Debian"

- name: Ensure Percona YUM repository
  yum:
    name: "{{ pmm_client_repo }}"
    state: present
  delay: 10
  register: result
  retries: 3
  until: result is succeeded
  when: ansible_os_family == "RedHat"
